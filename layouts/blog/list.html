{{ define "main" }}
<style>
    /* Blog */

    .blog-list {
        max-width: 1000px;
        margin: 0 auto;

        display: grid;
        gap: 1.5rem;
    }

    .blog-card {
        display: grid;
        grid-template-columns: 280px 1fr;

        border: 1px solid var(--border-color);
        border-radius: 8px;

        overflow: hidden;
    }

    .blog-card-teaser {
        display: block;
    }

    .blog-card-teaser img {
        display: block;

        width: 100%;
        height: 100%;

        object-fit: cover;
    }

    .blog-card-content {
        padding: 1.25rem;
    }

    .blog-card-content h2 {
        margin: 0 0 0.35rem;
    }

    .blog-card-content h2 a {
        color: var(--text-color);
        text-decoration: none;
    }

    .blog-card-content h2 a:hover {
        color: var(--brand-color);
    }

    .blog-card-content time {
        color: var(--muted-color);
        font-size: 0.9rem;
    }

    .blog-card-content p {
        line-height: 1.5;
    }

    @media (max-width: 700px) {
        .blog-card {
            grid-template-columns: 1fr;
        }

        .blog-card-teaser img {
            height: 200px;
        }
    }
</style>
<main class="page">

    <header class="page-header">
        <h1>{{ .Title }}</h1>

        {{ with .Description }}
        <p>{{ . }}</p>
        {{ end }}
    </header>

    <div class="blog-list">

        {{ range .Pages.ByDate.Reverse }}

        <article class="blog-card">

            {{ with .Params.teaser }}
            <a href="{{ $.RelPermalink }}" class="blog-card-teaser">
                <img src="{{ . }}" alt="">
            </a>
            {{ end }}

            <div class="blog-card-content">

                <h2>
                    <a href="{{ .RelPermalink }}">
                        {{ .Title }}
                    </a>
                </h2>

                <time datetime="{{ .Date.Format " 2006-01-02" }}">
                    {{ .Date.Format "2 January 2006" }}
                </time>

                <p>
                    {{ .Summary | plainify | truncate 180 }}
                </p>

                <a href="{{ .RelPermalink }}">
                    Read more →
                </a>

            </div>

        </article>

        {{ end }}

    </div>

</main>

{{ end }}
